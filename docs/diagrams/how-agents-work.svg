<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1010" width="1440" height="1010" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#a8a29e"/>
  </marker>
  <style>
    .t    { font-size:36px; font-weight:700; fill:#1c1917 }
    .sub  { font-size:16px; fill:#78716c }
    .band { font-size:12px; font-weight:700; fill:#a8a29e; letter-spacing:1.6px }
    .h    { font-size:16px; font-weight:650; fill:#1c1917 }
    .d    { font-size:13px; fill:#57534e }
    .dm   { font-size:13px; fill:#a8a29e }
    .chip { font-size:12.5px; font-weight:600; fill:#292524 }
    .bdg  { font-size:9.5px; font-weight:700; letter-spacing:1px; fill:#92400e }
    .note { font-size:13.5px; fill:#57534e }
    .noteb{ font-size:13.5px; font-weight:700; fill:#1c1917 }
  </style>
</defs>

<rect width="1440" height="1010" fill="#fbfbfa"/>

<text class="t"   x="50" y="60">How the AI agent works</text>
<text class="sub" x="50" y="90">One assistant that knows your business, answers wherever customers turn up, and hands you what it collected. Needs <tspan font-weight="700" fill="#7c3aed">Pro $30/mo</tspan>.</text>

<!-- ══ BAND 1: what it knows ══ -->
<text class="band" x="50" y="146">1 — WHAT IT KNOWS  ·  ASSEMBLED FRESH EVERY CONVERSATION, SO IT CAN'T GO STALE</text>

<g><rect x="50" y="162" width="209" height="106" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="70" cy="191" r="5" fill="#7c3aed"/><text class="h" x="84" y="196">Your profile</text>
<text class="d" x="70" y="224">Who you are, where,</text><text class="d" x="70" y="242">hours, the story.</text></g>

<g><rect x="273" y="162" width="209" height="106" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="293" cy="191" r="5" fill="#7c3aed"/><text class="h" x="307" y="196">Your products</text>
<text class="d" x="293" y="224">Names, prices and</text><text class="d" x="293" y="242">descriptions.</text></g>

<g><rect x="496" y="162" width="209" height="106" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="516" cy="191" r="5" fill="#7c3aed"/><text class="h" x="530" y="196">Your events</text>
<text class="d" x="516" y="224">What's on and when,</text><text class="d" x="516" y="242">including tickets.</text></g>

<g><rect x="719" y="162" width="209" height="106" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="739" cy="191" r="5" fill="#7c3aed"/><text class="h" x="753" y="196">Notes you write</text>
<text class="d" x="739" y="224">Answers to the things</text><text class="d" x="739" y="242">people always ask.</text></g>

<g><rect x="942" y="162" width="209" height="106" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="962" cy="191" r="5" fill="#7c3aed"/><text class="h" x="976" y="196">A PDF you drop</text>
<text class="d" x="962" y="224">Menu, policies or a</text><text class="d" x="962" y="242">brochure — read once.</text></g>

<g><rect x="1165" y="162" width="225" height="106" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="1185" cy="191" r="5" fill="#7c3aed"/><text class="h" x="1199" y="196">How it should sound</text>
<text class="d" x="1185" y="224">Warm, brisk, formal —</text><text class="d" x="1185" y="242">your call.</text></g>

<g stroke="#a8a29e" stroke-width="1.5" fill="none">
  <path d="M154 268 L154 284 M377 268 L377 284 M600 268 L600 284 M823 268 L823 284 M1046 268 L1046 284 M1277 268 L1277 284"/>
  <path d="M154 284 L1277 284"/>
</g>
<path d="M720 284 L720 298" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#a)" fill="none"/>

<g><rect x="50" y="304" width="1340" height="72" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text class="h" x="76" y="336">Your agent</text>
<text class="d" x="76" y="360">The <tspan font-weight="700">same brain on every channel below</tspan> — so the phone and the website can never tell a customer two different things. Update a price and it knows immediately.</text></g>

<!-- ══ BAND 2: channels ══ -->
<text class="band" x="50" y="432">2 — WHERE IT ANSWERS</text>

<g><rect x="50" y="448" width="425" height="150" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="70" cy="477" r="5" fill="#d97706"/><text class="h" x="84" y="482">On your page</text>
<text class="d" x="70" y="510">An Ask button on your public profile. Visitors</text><text class="d" x="70" y="528">ask about prices, opening times, what's on —</text><text class="d" x="70" y="546">and get an answer instead of leaving.</text>
<text class="dm" x="70" y="574">day or night, no waiting</text></g>

<g><rect x="507" y="448" width="426" height="150" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="527" cy="477" r="5" fill="#059669"/><text class="h" x="541" y="482">On the phone</text>
<text class="d" x="527" y="510">A real number your agent answers out loud.</text>
<text class="d" x="527" y="536">Point <tspan font-weight="700">your existing number</tspan> at us instead of at</text><text class="d" x="527" y="554">voicemail — nobody has to learn a new one.</text>
<text class="dm" x="527" y="580">it says it's an assistant · calls are not recorded</text></g>

<g><rect x="965" y="448" width="425" height="150" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="985" cy="477" r="5" fill="#7c3aed"/><text class="h" x="999" y="482">To you</text>
<text class="d" x="985" y="510">Chat to your own agent to check what it says</text><text class="d" x="985" y="528">before customers do.</text>
<text class="d" x="985" y="554">Every conversation it had, web or phone, lands</text><text class="d" x="985" y="572">in one inbox you can read back.</text></g>

<!-- ══ BAND 3: actions ══ -->
<text class="band" x="50" y="656">3 — WHAT IT CAN ACTUALLY DO  ·  NOT JUST TALK</text>

<g><rect x="50" y="672" width="325" height="176" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="70" cy="701" r="5" fill="#059669"/><text class="h" x="84" y="706">Answer about what you sell</text>
<text class="d" x="70" y="734">Prices, what's in it, what's on</text><text class="d" x="70" y="752">this weekend — straight away,</text><text class="d" x="70" y="770">with no lookup delay on a call.</text>
<text class="dm" x="70" y="800">it already has your catalog,</text><text class="dm" x="70" y="818">so there's nothing to fetch</text></g>

<g><rect x="391" y="672" width="325" height="176" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="411" cy="701" r="5" fill="#059669"/><text class="h" x="425" y="706">Take a message</text>
<text class="d" x="411" y="734">Name and how to reach them,</text><text class="d" x="411" y="752">plus what they wanted.</text>
<text class="d" x="411" y="778">Lands in your inbox as a lead,</text><text class="d" x="411" y="796">whether they rang or typed.</text>
<text class="dm" x="411" y="826">nobody hits a dead end</text></g>

<g><rect x="732" y="672" width="325" height="176" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="752" cy="701" r="5" fill="#059669"/><text class="h" x="766" y="706">Book people in</text>
<text class="d" x="752" y="734">With <tspan font-weight="700">Square</tspan> connected it offers your</text><text class="d" x="752" y="752">real free slots and takes the time.</text>
<text class="d" x="752" y="778">Without it, it takes a <tspan font-weight="700">request</tspan> you</text><text class="d" x="752" y="796">confirm — and says "request", never</text><text class="d" x="752" y="814">"you're booked".</text>
<text class="dm" x="752" y="838">nobody is sent to a closed door</text></g>

<g><rect x="1073" y="672" width="317" height="176" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="1093" cy="701" r="5" fill="#059669"/><text class="h" x="1107" y="706">Check an order</text>
<text class="d" x="1093" y="734">"Where's my order?" answered</text><text class="d" x="1093" y="752">without you looking it up.</text>
<rect x="1093" y="772" width="277" height="58" rx="9" fill="#fef3c7" stroke="#fcd34d"/>
<text class="chip" x="1109" y="792" fill="#92400e">It never takes card details</text>
<text class="dm" x="1109" y="812" fill="#92400e">to pay, it sends a link instead</text></g>

<!-- footer -->
<line x1="50" y1="886" x2="1390" y2="886" stroke="#e7e5e4" stroke-width="1.5"/>
<text class="noteb" x="50" y="918">Teaching it</text>
<text class="note"  x="50" y="942">You don't write prompts. <tspan font-weight="700">Talk to it</tspan> — type or speak "be less pushy", "we close early on Sundays" — and it changes itself and tells you what it changed.</text>
<text class="note"  x="50" y="964">It can only ever edit the parts you own: the tone and your notes. It cannot rewrite its own rules, invent a price, or turn off the thing that stops it taking payment.</text>
<text class="dm"    x="50" y="990">Text messages out are not available yet — the carrier registration hasn't cleared — so email is how it reaches people who leave an address.</text>
</svg>
