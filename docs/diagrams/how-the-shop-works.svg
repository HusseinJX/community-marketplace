<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1010" width="1440" height="1010" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0 0 L10 5 L0 10 z" fill="#a8a29e"/>
  </marker>
  <style>
    .t    { font-size:36px; font-weight:700; fill:#1c1917 }
    .sub  { font-size:16px; fill:#78716c }
    .band { font-size:12px; font-weight:700; fill:#a8a29e; letter-spacing:1.6px }
    .h    { font-size:16px; font-weight:650; fill:#1c1917 }
    .d    { font-size:13px; fill:#57534e }
    .dm   { font-size:13px; fill:#a8a29e }
    .chip { font-size:12.5px; font-weight:600; fill:#292524 }
    .bdg  { font-size:9.5px; font-weight:700; letter-spacing:1px; fill:#92400e }
    .note { font-size:13.5px; fill:#57534e }
    .noteb{ font-size:13.5px; font-weight:700; fill:#1c1917 }
  </style>
</defs>

<rect width="1440" height="1010" fill="#fbfbfa"/>

<text class="t"   x="50" y="60">How the shop works</text>
<text class="sub" x="50" y="90">Vendors list · customers buy · money splits · the thing reaches them. Needs <tspan font-weight="700" fill="#7c3aed">Pro $30/mo</tspan> + a connected bank.</text>

<!-- ══ BAND 1 ══ -->
<text class="band" x="50" y="146">1 — GETTING PRODUCTS IN</text>

<g><rect x="50" y="162" width="252" height="112" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="70" cy="191" r="5" fill="#7c3aed"/><text class="h" x="84" y="196">Type it in</text>
<text class="d" x="70" y="224">Name, price, photo, and</text><text class="d" x="70" y="242">what kind of thing it is.</text></g>

<g><rect x="322" y="162" width="252" height="112" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="342" cy="191" r="5" fill="#7c3aed"/><text class="h" x="356" y="196">Scan a photo</text>
<text class="d" x="342" y="224">Menu, counter or shelf →</text><text class="d" x="342" y="242">AI reads it into drafts.</text>
<text class="dm" x="342" y="260">OpenAI vision</text></g>

<g><rect x="594" y="162" width="252" height="112" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="614" cy="191" r="5" fill="#2563eb"/><text class="h" x="628" y="196">Shopify</text>
<text class="d" x="614" y="224">Connect once with OAuth.</text><text class="d" x="614" y="242">Catalog syncs across.</text>
<text class="dm" x="614" y="260">via Composio</text></g>

<g><rect x="866" y="162" width="252" height="112" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="886" cy="191" r="5" fill="#2563eb"/><text class="h" x="900" y="196">Square</text>
<text class="d" x="886" y="224">Same — connect your POS,</text><text class="d" x="886" y="242">catalog comes over.</text>
<text class="dm" x="886" y="260">via Composio</text></g>

<g><rect x="1138" y="162" width="252" height="112" rx="14" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.5" stroke-dasharray="6 5"/>
<circle cx="1158" cy="191" r="5" fill="#a8a29e"/><text class="h" x="1172" y="196" fill="#78716c">Printify</text>
<rect x="1268" y="180" width="102" height="19" rx="9.5" fill="#fef3c7" stroke="#fcd34d"/><text class="bdg" x="1319" y="193.5" text-anchor="middle">COMING SOON</text>
<text class="dm" x="1158" y="224">Print-on-demand shirts,</text><text class="dm" x="1158" y="242">mugs, prints.</text></g>

<g stroke="#a8a29e" stroke-width="1.5" fill="none">
  <path d="M176 274 L176 292 M448 274 L448 292 M720 274 L720 292 M992 274 L992 292 M1264 274 L1264 292"/>
  <path d="M176 292 L1264 292"/>
</g>
<path d="M720 292 L720 306" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#a)" fill="none"/>

<g><rect x="50" y="312" width="1340" height="78" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
<text class="h" x="76" y="344">Your catalog</text>
<text class="d" x="76" y="368">Everything arrives as a <tspan font-weight="700">draft you approve</tspan> — nothing goes on sale by itself. A nightly re-sync updates prices and photos, but never re-publishes something you took down.</text></g>

<!-- ══ BAND 2 ══ -->
<text class="band" x="50" y="446">2 — SOMEONE BUYS</text>

<g><rect x="50" y="462" width="309" height="126" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="70" cy="491" r="5" fill="#d97706"/><text class="h" x="84" y="496">Customer</text>
<text class="d" x="70" y="524">No account needed. Email only.</text><text class="d" x="70" y="542">Picks up the basket, chooses</text><text class="d" x="70" y="560">how they want to get it.</text></g>

<path d="M359 525 L388 525" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#a)"/>

<g><rect x="394" y="462" width="309" height="126" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="414" cy="491" r="5" fill="#2563eb"/><text class="h" x="428" y="496">Card payment</text>
<text class="d" x="414" y="524">Stripe Payment Element.</text>
<text class="d" x="414" y="542"><tspan font-weight="700">Every price is re-checked</tspan></text><text class="d" x="414" y="560">against your catalog first.</text></g>

<path d="M703 525 L732 525" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#a)"/>

<g><rect x="738" y="462" width="309" height="126" rx="14" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="1.5"/>
<circle cx="758" cy="491" r="5" fill="#059669"/><text class="h" x="772" y="496">Money splits</text>
<text class="d" x="758" y="524">Straight into <tspan font-weight="700">your</tspan> Stripe account.</text>
<text class="d" x="758" y="542">Platform keeps <tspan font-weight="700">5% of items only</tspan> —</text><text class="d" x="758" y="560">never of a delivery fee.</text></g>

<path d="M1047 525 L1076 525" stroke="#a8a29e" stroke-width="1.5" marker-end="url(#a)"/>

<g><rect x="1082" y="462" width="309" height="126" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="1102" cy="491" r="5" fill="#7c3aed"/><text class="h" x="1116" y="496">Order lands</text>
<text class="d" x="1102" y="524">Shows in your Orders screen.</text><text class="d" x="1102" y="542">Customer gets a receipt.</text>
<text class="dm" x="1102" y="560">email via Resend</text></g>

<!-- ══ BAND 3 ══ -->
<text class="band" x="50" y="646">3 — HOW IT REACHES THEM  ·  DECIDED BY WHAT YOU SOLD</text>

<g><rect x="50" y="662" width="309" height="186" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="70" cy="691" r="5" fill="#7c3aed"/><text class="h" x="84" y="696">Physical item</text>
<rect x="70" y="712" width="269" height="34" rx="8" fill="#f5f5f4"/>
<text class="chip" x="84" y="734">Pickup — they collect from you</text>
<rect x="70" y="752" width="269" height="34" rx="8" fill="#f5f5f4"/>
<text class="chip" x="84" y="774">You deliver — <tspan fill="#059669">you keep the fee</tspan></text>
<rect x="70" y="792" width="269" height="42" rx="8" fill="#fafaf9" stroke="#d6d3d1" stroke-dasharray="5 4"/>
<text class="chip" x="84" y="810" fill="#78716c">Uber courier</text>
<rect x="238" y="798" width="94" height="17" rx="8.5" fill="#fef3c7" stroke="#fcd34d"/><text class="bdg" x="285" y="810.5" text-anchor="middle">COMING SOON</text>
<text class="dm" x="84" y="827">waiting on Uber to switch us on</text></g>

<g><rect x="394" y="662" width="309" height="186" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="414" cy="691" r="5" fill="#7c3aed"/><text class="h" x="428" y="696">Digital download</text>
<text class="d" x="414" y="726">Delivered the second they pay —</text><text class="d" x="414" y="744">no action from you at all.</text>
<text class="d" x="414" y="770">Emailed a private link. Each open</text><text class="d" x="414" y="788">mints a fresh 5-minute URL, so a</text><text class="d" x="414" y="806">forwarded link dies but theirs</text><text class="d" x="414" y="824">keeps working forever.</text></g>

<g><rect x="738" y="662" width="309" height="186" rx="14" fill="#fff" stroke="#e7e5e4" stroke-width="1.5"/>
<circle cx="758" cy="691" r="5" fill="#7c3aed"/><text class="h" x="772" y="696">Service</text>
<text class="d" x="758" y="726">Nothing to hand over — you</text><text class="d" x="758" y="744">arrange it together.</text>
<text class="d" x="758" y="770">Reads <tspan font-weight="700">"Booked with the business"</tspan>,</text><text class="d" x="758" y="788">not "Pick up", and finishes as</text><text class="d" x="758" y="806">completed rather than collected.</text>
<text class="dm" x="758" y="830">pairs with Bookings →</text></g>

<g><rect x="1082" y="662" width="309" height="186" rx="14" fill="#fafaf9" stroke="#d6d3d1" stroke-width="1.5" stroke-dasharray="6 5"/>
<circle cx="1102" cy="691" r="5" fill="#a8a29e"/><text class="h" x="1116" y="696" fill="#78716c">Print-on-demand</text>
<rect x="1256" y="680" width="102" height="19" rx="9.5" fill="#fef3c7" stroke="#fcd34d"/><text class="bdg" x="1307" y="693.5" text-anchor="middle">COMING SOON</text>
<text class="dm" x="1102" y="726">Printify prints it and posts it.</text><text class="dm" x="1102" y="744">You never touch stock.</text>
<text class="dm" x="1102" y="770">Postage quoted before payment</text><text class="dm" x="1102" y="788">and paid to you, because</text><text class="dm" x="1102" y="806">Printify bills you for it.</text>
<text class="dm" x="1102" y="830">built, not yet proven live</text></g>

<!-- footer -->
<line x1="50" y1="888" x2="1390" y2="888" stroke="#e7e5e4" stroke-width="1.5"/>
<text class="noteb" x="50" y="920">Two rules that never bend</text>
<text class="note"  x="50" y="944">The <tspan font-weight="700">server decides</tspan>, never the customer's browser — prices come from your catalog, and what a basket needs is worked out from what's in it.</text>
<text class="note"  x="50" y="966">Whoever <tspan font-weight="700">pays the courier keeps the fee</tspan>. You drive → you keep it. Printify posts it → you keep it. Uber carries it → the platform keeps it.</text>
<text class="dm"    x="50" y="992">A basket mixing a download and a loaf of bread still needs collecting — one physical item makes the whole order physical.</text>
</svg>
